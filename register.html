<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyConnect - Client Registration</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const SUPABASE_URL = 'https://fhophxqeoeowhgqlihzq.supabase.co';
      const SUPABASE_ANON_KEY = 'sb_publishable_moji8A_nvf8TRP1NsGKlyg_jlup6r6d';
      const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>
</head>
<body class="h-full flex items-center justify-center p-6 text-slate-100 py-12">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-xl space-y-6">
        
        <!-- Large Logo and Title Header -->
        <div class="text-center space-y-3">
            <img src="logo.png" alt="EasyConnect Logo" class="h-32 w-32 mx-auto object-contain rounded-xl bg-slate-800/80 p-2 border border-slate-700 shadow-lg" onerror="this.src='https://placehold.co/128x64/indigo/white?text=EasyConnect'">
            <div>
                <h1 class="text-xl font-bold text-white tracking-tight">Create Account</h1>
                <p class="text-xs text-slate-400 mt-0.5">Join the EasyConnect platform</p>
            </div>
        </div>

        <form id="register-form" onsubmit="handleRegister(event)" class="space-y-4">
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">First Name</label>
                    <input type="text" id="reg-firstname" required placeholder="John" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Last Name</label>
                    <input type="text" id="reg-lastname" required placeholder="Doe" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Email Address</label>
                <input type="email" id="reg-email" required placeholder="name@example.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Phone Number</label>
                <input type="tel" id="reg-phone" required placeholder="08012345678" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Password</label>
                <input type="password" id="reg-password" required minlength="6" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Confirm Password</label>
                <input type="password" id="reg-confirmpassword" required minlength="6" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500">
            </div>

            <p id="reg-error" class="text-xs text-rose-400 hidden font-medium"></p>
            <p id="reg-success" class="text-xs text-emerald-400 hidden font-medium">Registration successful! Redirecting...</p>
            
            <button type="submit" id="reg-btn" class="cursor-pointer w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition text-xs shadow-lg shadow-indigo-600/20">
                Complete Sign Up
            </button>
        </form>

        <p class="text-xs text-center text-slate-400">
            Already have an account? <a href="login.html" class="text-indigo-400 font-semibold hover:underline">Sign In</a>
        </p>
    </div>

    <script>
        async function handleRegister(e) {
            e.preventDefault();
            
            const btn = document.getElementById('reg-btn');
            const errEl = document.getElementById('reg-error');
            const succEl = document.getElementById('reg-success');
            
            errEl.classList.add('hidden');
            succEl.classList.add('hidden');

            const firstName = document.getElementById('reg-firstname').value.trim();
            const lastName = document.getElementById('reg-lastname').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const phone = document.getElementById('reg-phone').value.trim();
            const password = document.getElementById('reg-password').value;
            const confirmPassword = document.getElementById('reg-confirmpassword').value;

            if (password !== confirmPassword) {
                errEl.innerText = "Passwords do not match.";
                errEl.classList.remove('hidden');
                return;
            }

            try {
                btn.disabled = true;
                btn.innerText = "Processing...";

                const { data, error } = await supabase.auth.signUp({
                    email,
                    password,
                    options: {
                        data: { first_name: firstName, last_name: lastName, phone: phone }
                    }
                });

                if (error) {
                    throw error;
                }

                succEl.classList.remove('hidden');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);

            } catch (err) {
                errEl.innerText = err.message || "An unexpected error occurred.";
                errEl.classList.remove('hidden');
                btn.disabled = false;
                btn.innerText = "Complete Sign Up";
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyConnect - Client Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const SUPABASE_URL = 'https://fhophxqeoeowhgqlihzq.supabase.co';
      const SUPABASE_ANON_KEY = 'sb_publishable_moji8A_nvf8TRP1NsGKlyg_jlup6r6d';
      const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>
</head>
<body class="h-full flex items-center justify-center p-6 text-slate-100">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-xl space-y-6">
        
        <!-- Large Logo and Title Header -->
        <div class="text-center space-y-3">
            <img src="logo.png" alt="EasyConnect Logo" class="h-32 w-32 mx-auto object-contain rounded-xl bg-slate-800/80 p-2 border border-slate-700 shadow-lg" onerror="this.src='https://placehold.co/128x64/indigo/white?text=EasyConnect'">
            <div>
                <h1 class="text-xl font-bold text-white tracking-tight">Client Sign In</h1>
                <p class="text-xs text-slate-400 mt-0.5">Access your EasyConnect profile</p>
            </div>
        </div>

        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Email Address</label>
                <input type="email" id="login-email" required placeholder="name@example.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Password</label>
                <input type="password" id="login-password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500">
            </div>
            <p id="login-error" class="text-xs text-rose-400 hidden font-medium"></p>
            
            <button type="submit" id="login-btn" class="cursor-pointer w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition text-xs shadow-lg shadow-indigo-600/20">
                Sign In
            </button>
        </form>

        <p class="text-xs text-center text-slate-400">
            Don't have an account? <a href="register.html" class="text-indigo-400 font-semibold hover:underline">Register</a>
        </p>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            
            const btn = document.getElementById('login-btn');
            const errEl = document.getElementById('login-error');
            errEl.classList.add('hidden');

            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            try {
                btn.disabled = true;
                btn.innerText = "Signing In...";

                const { data, error } = await supabase.auth.signInWithPassword({ email, password });

                if (error) {
                    throw error;
                }

                window.location.href = 'profile.html';

            } catch (err) {
                errEl.innerText = err.message || "Invalid login credentials.";
                errEl.classList.remove('hidden');
                btn.disabled = false;
                btn.innerText = "Sign In";
            }
        }
    </script>
</body>
</html>
